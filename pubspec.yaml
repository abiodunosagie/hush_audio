name: hush_audio
description: >-
  Calm and sleep sound engine for Flutter, powered by Rust: pure tones, binaural and isochronic
  beats, seven noise colours and procedural nature sounds, synthesized live on the audio thread.
version: 0.1.0
repository: https://github.com/abiodunosagie/hush_audio
issue_tracker: https://github.com/abiodunosagie/hush_audio/issues
topics: [audio, ffi, rust, sound, sleep]
platforms:
  android:
  ios:
  macos:

environment:
  sdk: ^3.13.3

dependencies:
  code_assets: ^2.1.0
  ffi: ^2.2.0
  hooks: ^2.2.0
  logging: ^1.3.0
  native_toolchain_rust: ^1.0.7
dev_dependencies:
  flutter_lints: ^6.0.0
  test: ^1.28.0
