name: hush_audio
description: >-
  Calm and sleep sound engine for Flutter, powered by Rust: tones, binaural beats, noise colours
  and nature sounds, synthesized live.
version: 0.1.0
repository: https://github.com/abiodunosagie/hush_audio
issue_tracker: https://github.com/abiodunosagie/hush_audio/issues
topics: [audio, ffi, rust, sound, sleep]
platforms:
  android:
  ios:
  macos:
screenshots:
  - description: The example app on iPhone, playing an 852 Hz tone.
    path: doc/screenshot.png

environment:
  sdk: ^3.13.3

dependencies:
  ffi: ^2.2.0
  hooks: ^2.2.0
  # Its build hook runs on every consumer's machine; widen only after reviewing a new release.
  native_toolchain_rust: '>=1.0.7 <1.1.0'
dev_dependencies:
  flutter_lints: ^6.0.0
  test: ^1.28.0
